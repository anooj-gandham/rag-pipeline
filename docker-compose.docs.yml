services:
  docs:
    image: rag_pipeline_local_docs
    container_name: rag_pipeline_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.envs/.local/.django
    volumes:
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./rag_pipeline:/app/rag_pipeline:z
    ports:
      - '9000:9000'
    command: /start-docs
